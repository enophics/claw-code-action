name: Claw Issue Triage
description: Run Claw Code for issue triage in GitHub Actions
on:
  issues:
    types: [opened]

jobs:
  triage-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claw Code for Issue Triage
        uses: enophics/claw-code-action@v1
        with:
          # NOTE: /label-issue requires .claw/commands/label-issue.md and scripts/edit-issue-labels.sh in your repo (see this repo for examples)
          prompt: "/label-issue REPO: ${{ github.repository }} ISSUE_NUMBER: ${{ github.event.issue.number }}"

          enophic_api_key: ${{ secrets.ENOPHIC_API_KEY }}
          allowed_non_write_users: "*" # Required for issue triage workflow, if users without repo write access create issues
          github_token: ${{ secrets.GITHUB_TOKEN }}
