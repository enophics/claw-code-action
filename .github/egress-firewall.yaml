# Hosts that jobs on GitHub's egress-firewall runner (runs-on: ubuntu-24.04-firewall)
# may reach. All other hosts are blocked, apart from any that GitHub's firewall allows
# by default. Add a host only when a workflow step needs it, name it in full (no '*'), and say what uses it.
mode: enforce
allow:
  # Claw API: model requests, trading the workflow's GitHub identity token for a
  # short-lived API token, and fetching the Claw GitHub App's token in claw.yml and
  # claw-review.yml
  - api.enophic.com
  # GitHub API: calls made by the Claw Code action, by gh in scripts/gh.sh and
  # scripts/edit-issue-labels.sh, and by the /review-pr command
  - api.github.com
  # Claw Code install script: fetched by the Claw Code action, and by
  # test-custom-executables.yml ("Install Claw Code manually")
  - claw.ai
  # Claw Code binary, downloaded by the install script
  - downloads.claw.ai
  # Bun and Node.js release downloads (oven-sh/setup-bun and actions/setup-node)
  - release-assets.githubusercontent.com
  # npm packages (bun install in action.yml, base-action/action.yml and
  # test-mcp-servers.yml)
  - registry.npmjs.org
  # Bun install script (test-custom-executables.yml, "Install Bun manually")
  - bun.sh
  # apt packages bubblewrap and socat, which the Claw Code action installs when a
  # workflow admits users without write access (issue-triage.yml)
  - azure.archive.ubuntu.com
  - archive.ubuntu.com
  - security.ubuntu.com
